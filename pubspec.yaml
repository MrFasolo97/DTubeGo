

name: ovh.fso.dtubego
description: Client to interact with the avalon blockchain
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.9.0+114

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # auth related - web enabled
  google_sign_in: ^7.1.1 #android, ios and web
  cloud_firestore: ^5.6.12 #android, ios, mac, web
  firebase_auth: ^5.7.0 #android, ios, mac, web
  firebase_core: ^3.15.2 #android, ios, mac, web

  # auth related - not web enabled
  # github_sign_in: ^0.0.5-dev.4  #android, ios # incompatible with updated YT player and the new dart 3


  # CRYPTO RELATED
  pointycastle: ^3.1.1
  crypto_keys: ^0.3.0
  bs58check: ^1.0.2
  bs58: ^1.0.2
  secp256k1: ^0.3.0
  hex: ^0.2.0
  elliptic: ^0.3.1
  ecdsa: ^0.1.2
  encrypt: ^5.0.1
  crypto: ^3.0.1

  universal_io: ^2.0.4   # Webrequests on web, mobile and desktop

  # UI - video related
  # webview_flutter: ^3.0.0
  appinio_video_player: ^1.2.1 # player for IPFS, YT videos... maybe more?
  video_player: ^2.4.4
  youtube_explode_dart: ^1.12.0 #loading youtube metadata
  #chewie: ^1.3.4
  flick_video_player: ^0.9.0

  # UI - markdown related
  flutter_markdown: ^0.7.7+1  # display markdown (only post description for now)
  url_launcher: ^6.0.17 # Needed to forward users from dtubego to browsers
  expandable: ^5.0.1

  # UI - image/video related
  #camera: ^0.8.1+3 # gives possibility to capture camera input in own widget

  image_picker: ^1.2.0 # open file browser / record image/video
  file_picker: ^10.3.2
  mime: ^1.0.2

  # UI - responsive design
  native_device_orientation: ^2.0.3 # get the real device orientation
  responsive_sizer: ^3.1.0 # measuring sizes related to the screen size
  # auto_orientation: ^2.3.1 # rotate screen from code
  # responsive_framework: ^0.1.4 #detect device type

  # UI - specific elements related
  intl: ^0.20.2 # convert datetime to friendly strings
  badges: ^3.0.2 # notification count

  font_awesome_flutter: ^10.1.0 # icons
  google_fonts: ^4.0.3
  rflutter_alert: ^2.0.4
  flutter_speed_dial: ^7.0.0 # drop out menu
  chips_input: ^0.1.0

  another_flushbar: ^1.10.29 # global snackbar to inform the user about transactions
  loadmore: ^2.0.1 # collapsable widget for long video descriptions
  jiffy: ^6.1.0 # library to display time in a user friendly way
  # scroll_snap_list: ^0.8.1 # not needed for now (snapping lists like instagram explore page)
  share_plus: ^11.1.0 # share post
  introduction_screen: ^3.0.2 # onboarding screen
  #material_floating_search_bar: ^0.3.4
  qr_flutter: ^4.0.0 #qr generator
  pretty_qr_code: ^3.5.0 # another qr generator
  decorated_icon: ^1.2.1 # shadows for icons
  simple_shadow: ^0.3.0 #shadows for png files (dtube icon)
  flutter_staggered_grid_view: ^0.7.0 # explore page
  pinput: ^5.0.1 # pin input field on startup
  shimmer_animation: ^2.1.0+1 # glow animation over images
  flutter_animator: ^3.2.2 # various transform animations
  animations: ^2.0.3
  wave: ^0.2.2 # wave animation for upload button, login screen and more
  fl_chart: ^1.0.0 # charts

  # NETWORK - cache related
  cached_network_image: ^3.3.0

  # NETWORK - http related
  http: ^0.13.4
  dio: ^5.0.1


  # OTHERS - global stuff
  flutter_phoenix: ^1.0.0 # for restarting the app on purpose (e.g. logout)
  flutter_launcher_icons: ^0.14.4 # creating app icons
  package_info_plus: ^8.3.1 # reading version and build number from pubspec

  # state management and storage
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4

  # video processing
  video_compress: ^3.1.1 # compression & spize/aspect ratio & thumbnail generator

  # os related
  path_provider: ^2.0.11
  path: ^1.8.1

  # unsorted
  equatable: ^2.0.3
  carousel_slider: ^5.1.1
  visibility_detector: ^0.4.0+2
  tus_client: ^1.0.2
  quiver: ^3.2.1
  webview_flutter: ^4.2.2
  webview_flutter_web: ^0.2.2+1
  csslib: ^1.0.2
  flavor_getter: ^0.0.2
  disk_space_2: ^1.0.8
  archive: ^4.0.7

  webview_flutter_platform_interface: any
  markdown: any
  rxdart: any
  collection: any
  bloc: any
  auto_orientation_v2: ^2.3.6
  better_player_plus: ^1.0.8
  flutter_barcode_scanner_plus: ^3.0.8
  super_tag_editor: ^0.1.2
  saver_gallery: ^3.0.6
  flutter_image_optimizer: ^0.0.3
  flutter_web_auth_2: ^4.1.0
  crop_your_image: ^2.0.0
  youtube_player_flutter: ^9.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  dependency_validator: ^5.0.2
  # integration_test:
  #   sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon_noalpha.png"

flutter:
  uses-material-design: true
  assets:
    - assets/ca/lets-encrypt-r3.pem
    - assets/gifs/hovering_guy.gif
    - assets/gifs/hovering_girl1.gif
    - assets/gifs/hovering_girl2.gif
    - assets/gifs/hovering_messages.gif
    - assets/gifs/hovering_globe.gif
    - assets/gifs/hovering_network.gif
    - assets/gifs/hovering_graph.gif
    - assets/gifs/hovering_startup.gif
    - assets/gifs/hovering_freeandprivate.gif
    - assets/gifs/hovering_free.gif
    - assets/videos/firstpage.mp4
    - lib/res/mds/androidEULA.md
    - lib/res/mds/iOSEULA.md
    - lib/res/mds/uploadTerms.md
    - assets/images/
